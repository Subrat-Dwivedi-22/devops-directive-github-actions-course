name : Environment Variables
on : 
  workflow_dispatch : 
env : 
  WORKFLOW_ENV = workflow scopped
jobs : 
  job-1 : 
    runs-on : ubuntu-24.04
    env : 
      JOBS_ENV : job scopped
    steps : 
      - name : step 1 
        env : 
          STEPS_ENV : steps scopped
          STEP_ENV : steps scopped also
        run : |
          echo "$WORKFLOW_ENV"
          echo "$JOBS_ENV"
          echo "$STEPS_ENV"
          exho "STEP_ENV"
      - name : step 2
        run :
          - echo "$STEP_ENV"
  job-2 : 
    runs-on : ubuntu-24.04
    steps : 
      -run : |
        echo "$WORKFLOW_ENV"
        echo "$JOBS_ENV"
        echo "$STEPS_ENV"